<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
  <title id="t">Find.ly API</title>
  <desc id="d">The Find.ly API at /api/v1 connects one API key to the IntelX Modules, raw files by System ID and Storage ID, Stealer Export, Breach Search and the usage endpoint.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0a84ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#409cff"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="760" height="400" rx="16" fill="#050507"/>
  <rect width="760" height="400" rx="16" fill="url(#grid)"/>
  <ellipse cx="380" cy="208" rx="260" ry="150" fill="url(#halo)"/>
  <rect width="760" height="400" rx="16" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="759" height="399" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="380" y="46" text-anchor="middle" fill="#fafafa" font-family="Geist, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600">Find.ly API</text>

  <!-- Links from the API to each family -->
  <g stroke="#409cff" stroke-opacity="0.45" stroke-width="1.25" stroke-dasharray="4 5" fill="none">
    <path d="M338 180 L236 140"/>
    <path d="M422 180 L524 140"/>
    <path d="M340 224 L256 282"/>
    <path d="M420 224 L504 282"/>
    <path d="M380 252 L380 306"/>
  </g>
  <g fill="#409cff">
    <circle cx="236" cy="140" r="2.5"/>
    <circle cx="524" cy="140" r="2.5"/>
    <circle cx="256" cy="282" r="2.5"/>
    <circle cx="504" cy="282" r="2.5"/>
    <circle cx="380" cy="306" r="2.5"/>
  </g>

  <!-- Central node -->
  <circle cx="380" cy="204" r="62" fill="none" stroke="#0a84ff" stroke-opacity="0.18"/>
  <circle cx="380" cy="204" r="48" fill="url(#core)"/>
  <text x="380" y="203" text-anchor="middle" fill="#ffffff" font-family="Geist, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700">API</text>
  <text x="380" y="222" text-anchor="middle" fill="#ffffff" fill-opacity="0.85" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">/api/v1</text>

  <!-- Families -->
  <g font-family="Geist, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <g>
      <rect x="66" y="112" width="170" height="56" rx="12" fill="#0b0b0f" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="88" cy="140" r="5" fill="#0a84ff"/>
      <text x="102" y="136" fill="#fafafa" font-size="14" font-weight="600">IntelX Modules</text>
      <text x="102" y="154" fill="#a1a1aa" font-size="11">Search · Phonebook · Identity</text>
    </g>
    <g>
      <rect x="524" y="112" width="170" height="56" rx="12" fill="#0b0b0f" stroke="#409cff" stroke-opacity="0.45"/>
      <circle cx="546" cy="140" r="5" fill="#409cff"/>
      <text x="560" y="136" fill="#fafafa" font-size="14" font-weight="600">Breach Search</text>
      <text x="560" y="154" fill="#a1a1aa" font-size="11">FindLy Module</text>
    </g>
    <g>
      <rect x="86" y="282" width="170" height="56" rx="12" fill="#0b0b0f" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="108" cy="310" r="5" fill="#3ea2ff"/>
      <text x="122" y="306" fill="#fafafa" font-size="14" font-weight="600">Raw Files</text>
      <text x="122" y="324" fill="#a1a1aa" font-size="11">System ID · Storage ID</text>
    </g>
    <g>
      <rect x="504" y="282" width="170" height="56" rx="12" fill="#0b0b0f" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="526" cy="310" r="5" fill="#006fe0"/>
      <text x="540" y="306" fill="#fafafa" font-size="14" font-weight="600">Stealer Export</text>
      <text x="540" y="324" fill="#a1a1aa" font-size="11">.zip archive</text>
    </g>
    <g>
      <rect x="310" y="306" width="140" height="44" rx="12" fill="#0b0b0f" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="380" y="325" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="600">Usage</text>
      <text x="380" y="341" text-anchor="middle" fill="#a1a1aa" font-size="10.5">free, never billed</text>
    </g>
  </g>

  <text x="380" y="380" text-anchor="middle" fill="#71717a" font-family="Geist, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">One API key · JSON over HTTPS · Two daily quotas</text>
</svg>
